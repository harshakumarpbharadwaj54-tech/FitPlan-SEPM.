<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitPlan Workouts</title>
</head>
<body>
  <h1>Your workouts</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save workout</button>
  </form>

  <h2>Workout history</h2>
  <ul>
    {% for workout in workouts %}
      <li>
        {{ workout.workout_date }} — {{ workout.activity }}
        ({{ workout.duration_minutes }} minutes)
      </li>
    {% empty %}
      <li>No workouts recorded yet.</li>
    {% endfor %}
  </ul>

  <nav>
    <a href="{% url 'profile' %}">Profile</a>
    <a href="{% url 'meal_list' %}">Meals</a>
  </nav>
</body>
</html>
