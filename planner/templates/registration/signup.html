<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitPlan Sign Up</title>
</head>
<body>
  <h1>Create your FitPlan account</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>

  <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</body>
</html>
